<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollie Todo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 56px 40px;
      max-width: 420px;
      backdrop-filter: blur(10px);
    }
    .emoji { font-size: 64px; }
    h1 { margin-top: 16px; font-size: 32px; }
    p { margin-top: 12px; font-size: 16px; line-height: 1.6; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">✅</div>
    <h1>Ollie Todo</h1>
    <p>하루를 가볍게 정리하는 할 일 관리 앱</p>
    <p>A simple and delightful to-do app.</p>
  </div>
</body>
</html>
